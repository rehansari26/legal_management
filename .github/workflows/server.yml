```yaml
name: Server Tests

on:
  pull_request:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Legal Management Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            curl \
            redis-server \
            xvfb \
            libfontconfig1 \
            libxrender1 \
            libxext6 \
            libmariadb-dev \
            pkg-config \
            build-essential \
            python3-dev

          sudo service redis-server start

      - name: Install Yarn
        run: |
          npm install -g yarn

      - name: Install Frappe Bench
        run: |
          pip install frappe-bench

      - name: Initialize Frappe Bench
        run: |
          bench init frappe-bench \
            --frappe-branch version-16 \
            --python "$(which python)"

      - name: Get Legal Management App
        working-directory: frappe-bench
        run: |
          bench get-app legal_management \
            ${{ github.server_url }}/${{ github.repository }}.git

      - name: Create Test Site
        working-directory: frappe-bench
        run: |
          bench new-site test_site \
            --db-host 127.0.0.1 \
            --db-port 3306 \
            --admin-password admin \
            --mariadb-root-username root \
            --mariadb-root-password root \
            --no-mariadb-socket

      - name: Install Legal Management
        working-directory: frappe-bench
        run: |
          bench --site test_site install-app legal_management

      - name: Run Server Tests
        working-directory: frappe-bench
        run: |
          bench --site test_site run-tests \
            --app legal_management
```
