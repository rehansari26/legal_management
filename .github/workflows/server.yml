name: Individual

on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: legal-management-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Discover Test Modules
        id: set-matrix
        run: |
          matrix=$(find legal_management -path '*/test_*.py' \
            | xargs -r grep -l 'def test_' \
            | sort \
            | sed 's|\.py$||; s|/|.|g' \
            | jq -R -s -c 'split("\n") | map(select(length > 0)) | {include: map({test: .})}')

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

          if [ "$(echo "$matrix" | jq '.include | length')" -eq 0 ]; then
            echo "No test modules found"
            exit 1
          fi

  test:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}

    name: Test ${{ matrix.test }}

    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Required before bench init
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server mariadb-client
          redis-server --version
          mariadb --version

      - name: Add to Hosts
        run: |
          echo "127.0.0.1 test_site" | sudo tee -a /etc/hosts

      - name: Install Frappe and Legal Management
        run: |
          bash "${GITHUB_WORKSPACE}/.github/helper/install.sh"

      - name: Run Tests
        run: |
          cd ~/frappe-bench

          bench --site test_site run-tests \
            --module "${{ matrix.test }}" \
            --lightmode
